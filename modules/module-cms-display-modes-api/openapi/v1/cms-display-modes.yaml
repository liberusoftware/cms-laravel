openapi: 3.1.0
info:
  title: CMS Display Modes API
  version: 1.0.0
paths:
  /api/v1/cms/display-modes/modes:
    get:
      summary: List display modes
      parameters:
        - in: query
          name: content_type
          schema: {type: string}
      responses: {'200': {description: Display modes}}
    post:
      summary: Create a display mode
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses: {'201': {description: Created}}
  /api/v1/cms/display-modes/projection:
    get:
      summary: Select an active display mode projection
      responses: {'200': {description: Selected projection}}
