name: Package quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Lint package PHP
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check release files
        run: test -f README.md && test -f CHANGELOG.md && test -f LICENSE.md && test -f module.json

