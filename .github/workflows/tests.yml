name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Portability DoD (Phase 6 ticket 03): the full suite must be green on
        # every supported engine. sqlite is the fast dev default; mysql + pgsql
        # prove the schema/query builder code is genuinely engine-agnostic.
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, opcache, zip, gd, intl
          # Coverage is only collected on the sqlite leg (uploaded below); the
          # mysql/pgsql legs skip the driver to keep the matrix fast.
          coverage: ${{ matrix.db == 'sqlite' && 'xdebug' || 'none' }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Configure database connection (${{ matrix.db }})
        run: |
          {
            echo "DB_CONNECTION=${{ matrix.db }}"
            case "${{ matrix.db }}" in
              mysql)
                echo "DB_HOST=127.0.0.1"
                echo "DB_PORT=3306"
                echo "DB_DATABASE=testing"
                echo "DB_USERNAME=root"
                echo "DB_PASSWORD=secret"
                ;;
              pgsql)
                echo "DB_HOST=127.0.0.1"
                echo "DB_PORT=5432"
                echo "DB_DATABASE=testing"
                echo "DB_USERNAME=postgres"
                echo "DB_PASSWORD=secret"
                ;;
              sqlite)
                echo "DB_DATABASE=:memory:"
                ;;
            esac
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            XDEBUG_MODE=coverage php -d memory_limit=-1 artisan test --coverage-clover=coverage.xml --min=100
          else
            php artisan test
          fi

      - name: Upload coverage to Codecov
        if: matrix.db == 'sqlite'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
