name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  deployment:
  workflow_dispatch:

env:
  DB_DATABASE: liberu
  DB_USERNAME: liberu
  DB_PASSWORD: secret

jobs:

  composer-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: 'Blocking composer audit (fails the build on any known advisory)'
        run: composer audit --no-interaction --locked

  phpcpd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: 'Run Phpcpd'
        run: |
          sudo composer install
          sudo test -f phpcpd.phar || curl -L https://phar.phpunit.de/phpcpd.phar -o phpcpd.phar
          sudo php phpcpd.phar app/

  php-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: 'Run PHP syntax checks'
        run: |
          find app modules tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: 'Run Composer security audit'
        run: composer audit --locked --no-interaction
