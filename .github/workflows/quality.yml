name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, pcntl, posix
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # --- Style: the whole repo must be Pint-clean ---
      - name: Pint (code style)
        run: vendor/bin/pint --test

      # --- Static analysis: PHPStan at max level, whole repo (host debt baselined) ---
      - name: PHPStan (max level)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # --- Refactoring safety: Rector must report no pending changes ---
      - name: Rector (dry run)
        run: vendor/bin/rector process packages/liberu-cms --dry-run --no-progress-bar

      # --- Architecture: dependency direction + disable-any-module removability ---
      - name: Architecture & removability guards
        run: php artisan test tests/Feature/Cms/ArchitectureTest.php tests/Feature/Cms/RemovabilityTest.php tests/Feature/Cms/EmbeddabilityTest.php

      # --- Mutation testing on the CMS kernel's business logic ---
      # CALIBRATION RUN (pcov wired above): this step is non-blocking so it always
      # prints the kernel's real MSI / Covered Code MSI. Read those two numbers from
      # this log, set minMsi/minCoveredMsi in infection.json just below them, then
      # flip this step to blocking (delete `continue-on-error: true`). Until then the
      # thresholds in infection.json (80/90) are aspirational, not enforced.
      - name: Infection (mutation testing)
        continue-on-error: true
        run: vendor/bin/infection --no-progress --threads=max --ignore-msi-with-no-mutations
